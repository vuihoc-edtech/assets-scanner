container:
  image: cirrusci/flutter:latest
  cpu: 8
  memory: 16G

check_task:
  flutter_doctor_script: flutter doctor -v
  flutter_analyze_script:
    - bash scripts/dartfmt_check.sh
    - flutter pub get
    - cd example
    - dart run build_runner build --delete-conflicting-outputs
    - cd ..
    - flutter analyze
    - dart test